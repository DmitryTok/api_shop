services:
  web:
    build: .
    command: >
      bash -c "python api_shop/manage.py makemigrations && python api_shop/manage.py migrate && python api_shop/manage.py create_default_superuser && python api_shop/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_value:/static/
      - media_value:/media/
    ports:
      - "8080:8000"
    env_file:
      - ./.env

volumes:
  static_value:
  media_value: