services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    env_file:
      - ./.env
    volumes:
      - db_data:/var/lib/postgresql/data/
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    entrypoint: ""
    # Same principle as entrypoint.sh: automatic boot only migrates and
    # serves. Reference data and superuser creation are deliberate manual
    # steps — run `make seed` / `make superuser` after the stack is up.
    command: >
      bash -c "
      python api_shop/manage.py migrate &&
      python api_shop/manage.py load_terms &&
      python api_shop/manage.py load_users &&
      python api_shop/manage.py create_default_superuser &&
      python api_shop/manage.py runserver 0.0.0.0:8000
      "

    volumes:
      - .:/app
      - static_value:/static/
      - media_value:/media/
    ports:
      - "8080:8000"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  static_value:
  media_value:
  db_data:
