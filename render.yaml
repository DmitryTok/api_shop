services:
  - name: server-setup-deploy
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    branch: dev
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    # Deploys are triggered by the GitHub Actions "deploy-staging" job (which
    # only fires after lint+test pass), not by Render's own git integration —
    # avoids two independent deploy triggers racing each other.
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: staging
      - key: DEBUG
        value: "false"
      - key: SECRET
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SUPER_LOGIN
        sync: false
      - key: SUPER_PASSWORD
        sync: false

      # Known values for this deployment.
      - key: CORS_ALLOWED_ORIGINS
        value: https://great-wearly-shop.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://great-wearly-shop.vercel.app
      - key: DEFAULT_FROM_EMAIL
        value: noreply@example.com
