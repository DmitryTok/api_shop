[tool.isort]
multi_line_output = 3

[tool:pytest]
DJANGO_SETTINGS_MODULE = api_shop.settings
pythonpath = api_shop
python_files = tests.py test_*.py *_tests.py

[coverage:run]
omit =
    */apps.py,
    */migrations/*,
    */base/*,
    settings*,
    */tests/*,
    */wsgi,
    wsgi.py,
    */asgi.py,
    */__init__.py,
    */__init__.py,
    manage.py
    */models.py,
    */management/*,