minimum_pre_commit_version: "3.2.0"

default_language_version:
  python: python3.12

fail_fast: false

repos:
  # Repository safety and file consistency checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Prevent accidental commits directly to protected environment branches.
      # GitHub branch protection rules are still required on the remote repository.
      - id: no-commit-to-branch
        args:
          - --branch
          - dev
          - --branch
          - main
          - --branch
          - prod
      - id: check-added-large-files
        args:
          - --maxkb=1024
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Keep uv.lock synchronized with pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: uv-lock

    # Python linting and formatting. Ruff replaces isort and Black.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args:
          - --fix
          - --exit-non-zero-on-fix
        types_or:
          - python
          - pyi

      - id: ruff-format
        types_or:
          - python
          - pyi
